# managed-by: deployer-lb-server app=app-a revision=42
## app-a.workspacefy.com
upstream app_a_pool {
    server 10.10.0.2:10200;
    keepalive 16;
    keepalive_timeout 60s;
}

server {
    listen 80;                          # D11: HTTP puro na origem (cert é da CF, na borda)
    server_name app-a.workspacefy.com;
    underscores_in_headers on;
    # O default do nginx (1m) fica abaixo dos chunks de 3MB que o upload
    # chunked do backend envia (storage.py CHUNK_SIZE), então o proxy
    # respondia 413 antes da request chegar no app. 100m acompanha o cap
    # da Cloudflare (Free/Pro) e devolve a decisão para a aplicação, que
    # responde um 413 estruturado que o frontend sabe tratar.
    client_max_body_size 100m;
    include snippets/error-pages.conf;
    include snippets/cloudflare-real-ip.conf;   # set_real_ip_from <ranges CF> + real_ip_header CF-Connecting-IP

    location / {
        proxy_pass http://app_a_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
