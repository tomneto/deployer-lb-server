# managed-by: deployer-lb-server app=app-a revision=42
## app-a.workspacefy.com
## www.app-a.workspacefy.com
## app-a.example.com
proxy_cache_path /var/cache/nginx/app_a_pool levels=1:2 keys_zone=app_a_pool_cache:10m max_size=1g inactive=60m use_temp_path=off;
# Zona por pipeline, em contexto http (este arquivo é incluído de dentro dele).
# A chave é $binary_remote_addr DEPOIS do cloudflare-real-ip.conf, então conta
# o cliente de verdade — com o endereço da edge, o limite ou nunca dispara ou
# bloqueia todo mundo de uma vez.
limit_req_zone $binary_remote_addr zone=app_a_pool_rl:10m rate=10r/s;
upstream app_a_pool {
    server 10.10.0.2:10200;
    server 10.10.0.3:10200;
    keepalive 16;
    keepalive_timeout 60s;
}

server {
    listen 80;                          # D11: HTTP puro na origem (cert é da CF, na borda)
    server_name app-a.workspacefy.com www.app-a.workspacefy.com app-a.example.com;
    underscores_in_headers on;
    # O default do nginx (1m) fica abaixo dos chunks de 3MB que o upload
    # chunked do backend envia (storage.py CHUNK_SIZE), então o proxy
    # respondia 413 antes da request chegar no app. 100m acompanha o cap
    # da Cloudflare (Free/Pro) e devolve a decisão para a aplicação, que
    # responde um 413 estruturado que o frontend sabe tratar.
    client_max_body_size 100m;
    include snippets/error-pages.conf;
    include snippets/cloudflare-real-ip.conf;   # set_real_ip_from <ranges CF> + real_ip_header CF-Connecting-IP

    location / {
        proxy_pass http://app_a_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # `nodelay` serve o burst na hora em vez de enfileirar: sem ele uma
        # página com dezenas de assets carrega em câmera lenta mesmo dentro do
        # limite, e o remédio fica pior que a doença. 429 em vez do 503 padrão
        # porque é o código que diz "tente de novo", e é o que um cliente HTTP
        # sabe tratar.
        limit_req zone=app_a_pool_rl burst=25 nodelay;
        limit_req_status 429;

        proxy_cache app_a_pool_cache;
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
