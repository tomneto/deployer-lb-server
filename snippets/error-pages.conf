# managed-by: deployer-lb-server (static snippet, installed by setup.sh lb)
#
# Generic upstream error pages: when a backend is down/misbehaving the
# visitor gets a plain, branding-neutral message instead of a raw nginx
# error page or a proxy timeout with no body — same intent as the LB's
# default_server catch-all (D19), applied per managed app server block.

error_page 502 503 504 /_lb_upstream_error.html;

location = /_lb_upstream_error.html {
    internal;
    default_type text/html;
    return 503 "<html><head><title>Service temporarily unavailable</title></head><body><h1>503 Service temporarily unavailable</h1><p>The upstream application is not responding. Please try again shortly.</p></body></html>";
}
