# managed-by: deployer-lb-server (static snippet, installed by setup.sh lb)
#
# Paginas de erro da BORDA, com a identidade do produto. Os arquivos ficam em
# /etc/nginx/lb-errors/ e sao instalados pelo mesmo passo que instala este
# snippet (setup.sh, step4_config_lb).
#
# Tres coisas aqui sao decisao, nao detalhe:
#
# 1. ARQUIVO, e nao `return`. A versao anterior respondia
#    `return 503 "<html>..."`, o que COLAPSAVA os codigos: 502, 503 e 504
#    chegavam todos como 503, inclusive para quem estava depurando. Servindo
#    arquivo, o nginx preserva o status original.
#
# 2. A location e PUBLICA, sem `internal`. A Cloudflare nao aceita HTML em
#    Error Pages -- ela busca uma URL, baixa a pagina e embute os recursos.
#    Uma location `internal` e inalcancavel para ela. O prefixo proprio
#    (/_lb/errors/) existe para essa exposicao ser explicita e estreita.
#
# 3. SO os codigos que o nginx gera por conta propria. Nao ha
#    `proxy_intercept_errors` aqui, e nao deve haver: ele sequestraria o 404 e
#    o 500 DA APLICACAO, que pertencem a ela e costumam carregar corpo util
#    (um JSON de erro de API, por exemplo). Esta pagina e para a falha da
#    borda, nao para a resposta do backend.
#
# 494-497 sao codigos internos do nginx (header grande demais, HTTP para porta
# HTTPS e vizinhos). Eles nunca chegam ao cliente com esse numero, mas sem
# mapea-los o visitante recebe a pagina padrao do nginx, que anuncia a versao.

error_page 400 408 414 494 495 496 497  /_lb/errors/4xx.html;
error_page 413                          /_lb/errors/413.html;
error_page 500 502 503                  /_lb/errors/5xx.html;
error_page 504                          /_lb/errors/504.html;

location ^~ /_lb/errors/ {
    alias /etc/nginx/lb-errors/;

    # A pagina muda quando o LB e reprovisionado, e nao mais que isso.
    add_header Cache-Control "public, max-age=300" always;

    # Nada aqui deve ser indexado: e conteudo de falha, e a Cloudflare busca
    # a URL diretamente, sem passar por buscador.
    add_header X-Robots-Tag "noindex, nofollow" always;
}
