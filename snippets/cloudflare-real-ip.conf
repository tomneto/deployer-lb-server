# managed-by: deployer-lb-server (static snippet, installed by setup.sh lb)
#
# D11 requirement: between Cloudflare and this LB the traffic is HTTP-only on
# port 80 (TLS terminates at the CF edge). Without this snippet every
# $remote_addr becomes a Cloudflare edge IP instead of the real client IP,
# breaking logs/rate-limiting. Ranges below are Cloudflare's published
# IPv4/IPv6 pools (https://www.cloudflare.com/ips-v4, /ips-v6) — re-sync
# periodically; setup.sh does not auto-update this file on re-run (D8: "se já
# existe, valida e segue" — content refresh is a manual/CI concern, not
# provisioning).

