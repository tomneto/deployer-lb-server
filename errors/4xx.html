<!--
  managed-by: deployer-lb-server (static error page, installed by setup.sh lb)

  Autocontida por obrigacao, e sao duas obrigacoes distintas:

  1. Esta pagina aparece quando algo ja falhou. Buscar fonte, folha de estilo
     ou imagem de fora seria apostar que a rede coopera no exato momento em
     que ela nao esta cooperando.
  2. E a mesma URL que a Cloudflare busca para Error Pages. Ela baixa a
     pagina, embute os recursos referenciados e guarda o resultado, que
     precisa ficar abaixo de ~1,5 MB ja com tudo inline.

  Por isso: CSS inline, SVG inline, nenhum @import, nenhum <img src>.

  Os tokens visuais vem de backoffice_frontend/src/index.css e
  tailwind.config.cjs. Eles existem em dois repositorios, o que e o custo
  aceito para a pagina nao depender do painel estar no ar:

    primaria        #8B5CF6
    fundo (dark)    hsl(250 15% 4%)     cartao  hsl(250 12% 7%)
    borda (dark)    hsl(250 10% 15%)    texto   hsl(0 0% 98%)
    fundo (light)   hsl(240 20% 98%)    cartao  #fff
    raio            0.5rem
    gradiente       .auth-backdrop, index.css:167-174

  O logo e public/assets/icon.svg do painel -- a unica das tres marcacoes de
  logo do produto que esta completa (misc.jsx e primitives.jsx divergem dela).
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Requisição inválida</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: hsl(250 15% 4%);
      --card: hsl(250 12% 7%);
      --border: hsl(250 10% 15%);
      --fg: hsl(0 0% 98%);
      --muted: hsl(0 0% 63%);
      --primary: #8B5CF6;
      --radius: 0.5rem;
    }
    /* O produto nasce escuro, mas uma pagina de erro que cega quem esta num
       ambiente claro e uma falha a mais. Os dois temas vem de index.css. */
    @media (prefers-color-scheme: light) {
      :root {
        --bg: hsl(240 20% 98%);
        --card: #fff;
        --border: hsl(250 15% 90%);
        --fg: hsl(0 0% 9%);
        --muted: hsl(0 0% 40%);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background-color: var(--bg);
      /* .auth-backdrop -- o unico gradiente de pagina do produto. */
      background-image: radial-gradient(ellipse 80% 60% at 50% -10%,
        rgba(139, 92, 246, 0.18), transparent);
      background-repeat: no-repeat;
      color: var(--fg);
      /* Sem @import: usa a fonte se a maquina a tiver, e cai na pilha nativa
         se nao tiver. Baixar fonte numa pagina de falha seria o contrario do
         que ela existe para fazer. */
      font-family: Inter, "Plus Jakarta Sans", system-ui, -apple-system,
        "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 30rem;
      padding: 2rem;
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) * 1.5);
      background: var(--card);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    .logo { width: 3rem; height: 3rem; display: block; margin: 0 auto 1.25rem; }
    .code {
      margin: 0;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--primary);
    }
    h1 {
      margin: 0.5rem 0 0;
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    p.lede { margin: 0.75rem 0 0; color: var(--muted); }
    p.hint {
      margin: 1.5rem 0 0;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.8125rem;
      color: var(--muted);
    }
    @media (max-width: 30rem) {
      .card { padding: 1.5rem; }
      h1 { font-size: 1.25rem; }
    }
  </style>
</head>
<body>
  <main class="card">
      <svg class="logo" viewBox="0 0 1024 1024" role="img" aria-label="Workspacefy">
        <defs>
          <linearGradient id="wfIcon" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#A78BFA"/>
            <stop offset="1" stop-color="#7C3AED"/>
          </linearGradient>
        </defs>
        <rect width="1024" height="1024" rx="230" fill="url(#wfIcon)"/>
        <g fill="none" stroke="#fff" stroke-width="104" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="448,300 620,704 792,300" stroke-opacity=".59"/>
          <polyline points="232,300 404,704 576,300"/>
        </g>
      </svg>
    <p class="code">Erro 4xx</p>
    <h1>Não foi possível entender este pedido</h1>
    <p class="lede">A requisição chegou malformada ou foi interrompida antes de terminar. Recarregar a página costuma resolver.</p>
    <p class="hint">Se você chegou por um link, ele pode estar quebrado.</p>
  </main>
</body>
</html>
