name: Release

# Resolves the setup.sh TODO(D10): without a published release, every
# install falls back to `go build` on either the backoffice orchestrator
# host or the target itself — neither is guaranteed to have (or be able to
# install) a Go toolchain. A static Go binary needs none of that, on any
# distro, once it's an actual release asset.
#
# Asset names must match what setup.sh's download_or_build_binary() fetches:
# `<binary>-linux-<goarch>` (no extension), e.g. `deployer-lb-server-linux-amd64`.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  integration-test:
    # Drives setup.sh's real agent flow over real SSH against
    # docker-compose.ssh-test.yaml (systemd + sshd, unprivileged concerns
    # aside — this DOES need --privileged/cgroup for systemd, unlike
    # selfApi's plain-alpine ssh-test fixture; validate this job is stable
    # on hosted runners before relying on it as a hard release gate long
    # term — see docker-compose.ssh-test.yaml's header for the known risk).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run agent SSH integration tests
        run: bash scripts/test-agent-ssh.sh

  build:
    needs: integration-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `git describe --tags` resolves

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          ver="$(git describe --tags --always --dirty)"
          ldflags="-X github.com/tomneto/deployer-lb-server/internal/version.Version=${ver}"

          go build -tags lb -ldflags "$ldflags" \
            -o "deployer-lb-server-linux-${GOARCH}" ./cmd/apply-server
          go build -tags agent -ldflags "$ldflags" \
            -o "deployer-lb-agent-linux-${GOARCH}" ./cmd/agent

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goarch }}
          path: |
            deployer-lb-server-linux-${{ matrix.goarch }}
            deployer-lb-agent-linux-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
