name: Release

# Resolves the setup.sh TODO(D10): without a published release, every
# install falls back to `go build` on either the backoffice orchestrator
# host or the target itself — neither is guaranteed to have (or be able to
# install) a Go toolchain. A static Go binary needs none of that, on any
# distro, once it's an actual release asset.
#
# Asset names must match what setup.sh's download_or_build_binary() fetches:
# `<binary>-linux-<goarch>` (no extension), e.g. `deployer-lb-server-linux-amd64`.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `git describe --tags` resolves

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          ver="$(git describe --tags --always --dirty)"
          ldflags="-X github.com/tomneto/deployer-lb-server/internal/version.Version=${ver}"

          go build -tags lb -ldflags "$ldflags" \
            -o "deployer-lb-server-linux-${GOARCH}" ./cmd/apply-server
          go build -tags agent -ldflags "$ldflags" \
            -o "deployer-lb-agent-linux-${GOARCH}" ./cmd/agent

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goarch }}
          path: |
            deployer-lb-server-linux-${{ matrix.goarch }}
            deployer-lb-agent-linux-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Checkout FIRST, download-artifact SECOND. actions/checkout defaults to
      # clean:true, which runs `git clean -ffdx` over the workspace and deletes
      # any untracked directory already sitting there — including `dist/`.
      # With the order reversed, v0.3.0 published a release with ZERO assets
      # and the workflow still reported success, because `files:` matching
      # nothing is not an error for action-gh-release. Do not move this step
      # back down.
      #
      # Release notes are WRITTEN, in the tag's annotation — `git tag -a vX.Y.Z`
      # with the summary of what changed. The auto-generated commit list still
      # rides along (generate_release_notes below), but it is the appendix, not
      # the notes: a commit subject list doesn't tell an operator whether a new
      # agent is safe to roll out. A lightweight tag has no annotation, so the
      # body is left empty and only the generated list shows.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from the tag annotation
        run: |
          set -euo pipefail
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > notes.md
          cat notes.md

      # Belt and braces for the failure above: assert the four assets are on
      # disk before publishing, so a release can never again be cut empty and
      # be reported as a success. setup.sh's download_or_build_binary() falls
      # back to `go build` when an asset 404s, so an empty release degrades
      # silently into "every target compiles Go at provisioning time" — the
      # exact outcome this workflow exists to prevent.
      - name: Verify assets before publishing
        run: |
          set -euo pipefail
          ls -la dist/
          for f in deployer-lb-server-linux-amd64 deployer-lb-server-linux-arm64 \
                   deployer-lb-agent-linux-amd64 deployer-lb-agent-linux-arm64; do
            [[ -s "dist/$f" ]] || { echo "missing or empty asset: dist/$f" >&2; exit 1; }
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
